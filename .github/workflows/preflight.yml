name: preflight

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'patches/**'
      - 'build/**'
      - 'ios/**'
      - '.github/workflows/**'
  push:
    branches: ['**']
    paths:
      - 'patches/**'
      - 'build/**'
      - 'ios/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test preflight checker
        run: python3 -m unittest discover -s build -p test_preflight.py -v
      - name: Test portable writer path restoration with host compiler
        run: python3 -m unittest discover -s build -p test_portable_write.py -v
      - name: Test native project-save context lifetime
        run: python3 -m unittest discover -s build -p test_project_save_lifecycle.py -v
      - name: Test native tool-ring geometry with host compiler
        run: python3 -m unittest discover -s build -p test_tool_ring.py -v
      - name: Test contextual Pencil geometry, receipts and setting persistence
        run: python3 -m unittest discover -s build -p test_context_ring.py -v
      - name: Test floating workspace panels with host compiler
        run: python3 -m unittest discover -s build -p test_ipad_panels.py -v
      - name: Test panel resize modal lifetime
        run: python3 -m unittest discover -s build -p test_resize_lifetime.py -v
      - name: Test working seam modal geometry and lifetime
        run: python3 -m unittest discover -s build -p test_working_seam.py -v
      - name: Test screen DNA layout for both pointer widths
        run: python3 -m unittest discover -s build -p test_screen_dna_layout.py -v
      - name: Test launcher ordering and stale actions
        run: python3 -m unittest discover -s build -p test_launcher_order.py -v
      - name: Test native category picker styles and highlights
        run: python3 -m unittest discover -s build -p test_enum_picker.py -v
      - name: Test Inspector presentation ownership
        run: python3 -m unittest discover -s build -p test_ipad_inspector.py -v
      - name: Test saved layout history and reference safety
        run: python3 -m unittest discover -s build -p test_layout_history.py -v
      - name: Test native navigation hit ownership
        run: python3 -m unittest discover -s build -p test_native_navigation_hit.py -v
      - name: Test navigation interruption, native confirmation and cleanup
        run: python3 -m unittest discover -s build -p test_navigation_cancel.py -v
      - name: Test interrupted direct-tool transforms and selection
        run: python3 -m unittest discover -s build -p test_transform_touch.py -v
      - name: Test transform tool properties, orientation and ownership
        run: python3 -m unittest discover -s build -p test_transform_tool_properties.py -v
      - name: Test fine drag gain and independent keyboard precision
        run: python3 -m unittest discover -s build -p test_fine_drag_lifecycle.py -v
      - name: Test direct Extrude mesh rollback and batched motion ownership
        run: python3 -m unittest discover -s build -p test_touch_extrude.py -v
      - name: Test direct Bevel lifecycle, native routing and pointer precision
        run: python3 -m unittest discover -s build -p test_touch_bevel.py -v
      - name: Test accepted Extrude recovery
        run: python3 -m unittest discover -s build -p test_touch_undo_recovery.py -v
      - name: Test direct point selection and external modifier parity
        run: python3 -m unittest discover -s build -p test_touch_point_selection.py -v
      - name: Test direct-pinch navigation policy
        run: python3 -m unittest discover -s build -p test_touch_navigation.py -v
      - name: Test editing shelf placement, occlusion and native UI cleanup
        run: python3 -m unittest discover -s build -p test_editing_shelf.py -v
      - name: Test compact shelf queued-input receipts and native admission
        run: python3 -m unittest discover -s build -p test_compact_shelf.py -v
      - name: Test touch Mode native geometry and deferred owner receipts
        run: python3 -m unittest discover -s build -p test_touch_mode_access.py -v
      - name: Test admitted native Transform stroke feedback and bounded drawing
        run: python3 -m unittest discover -s build -p test_touch_stroke_cue.py -v
      - name: Test owned Pencil ring browsing and presented input receipts
        run: python3 -m unittest discover -s build -p test_pencil_ring_foundation.py -v
      - name: Test native Pencil page owners, draw gates and selection receipts
        run: python3 -m unittest discover -s build -p test_pencil_ring_native.py -v
      - name: Test rotating page geometry and shared native menu anchoring
        run: python3 -m unittest discover -s build -p test_pencil_ring_pages.py -v
      - name: Test Pencil barrel reset provenance and queued native cleanup
        run: python3 -m unittest discover -s build -p test_pencil_barrel_reset.py -v
      - name: Test Pencil ring contact and native popup dispatch
        run: python3 -m unittest discover -s build -p test_pencil_ring_contacts.py -v
      - name: Test native copyable Pencil action origin values
        run: python3 -m unittest discover -s build -p test_pencil_action_origin.py -v
      - name: Test Pencil-only hover-roll packets and native navigation receipts
        run: python3 -m unittest discover -s build -p test_pencil_ring_roll.py -v
      - name: Test native Pencil interaction owner proof and context-free disposal
        run: python3 -m unittest discover -s build -p test_pencil_callback_disposal.py -v
      - name: Test native tool icon styling for guarded Pencil inventory
        run: python3 -m unittest discover -s build -p test_pencil_native_tool_style.py -v
      - name: Test full native Pencil labels and refused-fit draw receipts
        run: python3 -m unittest discover -s build -p test_pencil_ring_labels.py -v
      - name: Test registered Pencil popup ownership and deferred cleanup
        run: python3 -m unittest discover -s build -p test_pencil_popup_ownership.py -v
      - name: Test immediate Pencil callback button lifetimes
        run: python3 -m unittest discover -s build -p test_pencil_button_lease.py -v
      - name: Test owned native Snap self-callback admission and outer-frame refusal
        run: python3 -m unittest discover -s build -p test_pencil_self_callback.py -v
      - name: Test explicit Pencil native-controls fallback and cascade close
        run: python3 -m unittest discover -s build -p test_pencil_native_fallback.py -v
      - name: Test Base entry and reversible native header/shelf admission
        run: python3 -m unittest discover -s build -p test_pencil_base_entry.py -v
      - name: Test fresh registered Pencil operator lifetime and Python wrapper identity
        run: python3 -m unittest discover -s build -p test_pencil_operator_lifetime.py -v
      - name: Test fresh native Pencil RNA roots and typed tool subgroups
        run: python3 -m unittest discover -s build -p test_pencil_rna_owner.py -v
      - name: Test connected Pencil constructors and explicit pending property handoff
        run: python3 -m unittest discover -s build -p test_pencil_rna_constructors.py -v
      - name: Test Pencil enum parent leases and failed-draw retirement
        run: python3 -m unittest discover -s build -p test_pencil_parent_properties.py -v
      - name: Test bounded pending Numbers property consumers and disposal
        run: python3 -m unittest discover -s build -p test_pencil_numbers.py -v
      - name: Test native Numbers arithmetic and finite array paste
        run: python3 -m unittest discover -s build -p test_pencil_numbers_expression.py -v
      - name: Test pending Numbers native unregister and terminal ownership
        run: python3 -m unittest discover -s build -p test_pencil_numbers_lifecycle.py -v
      - name: Validate patch against pinned upstream and check scripts
        run: python3 build/preflight.py
