# Build the unsigned Blender-iPad-Unofficial .ipa on a cloud macOS runner (no local Mac).
#
# Recipe adapted from the proven community workflow at
# https://github.com/Toemeler/blender-iOS-ipa (which publishes working IPAs built from
# blender/blender@ios). Adjusted to apply THIS repo's patch + custom icon/branding.
# The exact iOS-library fetch and dylib-bundling details may still need tuning against
# that reference on first run — compare if a step fails.
#
# Trigger: manually from the Actions tab, or by pushing a tag like v1.0.0.
name: build-ipa

on:
  workflow_dispatch:
    inputs:
      use_ccache:
        description: Reuse compiled objects (disable for a cold-build comparison)
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to attach the .ipa to a Release

env:
  BLENDER_COMMIT: d9b6fe34ddce527d93b97c0bf42ad92cebac4e4e
  USE_CCACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.use_ccache }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  HOMEBREW_NO_AUTO_UPDATE: '1'

concurrency:
  group: build-ipa-${{ github.ref }}
  # A new device-test build should queue, not discard an almost-finished IPA.
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    permissions:
      contents: read

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 350   # a full Blender build is large

    steps:
      - name: Checkout this overlay repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Fetch Blender source at the pinned commit (with LFS)
        run: |
          git init blender
          cd blender
          git remote add origin https://projects.blender.org/blender/blender.git
          git fetch --depth 1 origin "$BLENDER_COMMIT"
          GIT_LFS_SKIP_SMUDGE=1 git checkout FETCH_HEAD
          git lfs install
          git lfs pull
          python3 - <<'PY'
          from pathlib import Path
          data = Path('release/datafiles/startup.blend').read_bytes()
          if len(data) < 1024 or data.startswith(b'version https://git-lfs.github.com/spec/'):
              raise SystemExit('startup.blend is missing its LFS content; refusing a broken build')
          PY

      - name: Cache iOS / host libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            blender/lib/ios_arm64
            blender/lib/macos_arm64
            blender/lib/macos_x64
          key: blender-ios-libs-v2-${{ runner.arch }}-${{ env.BLENDER_COMMIT }}

      - name: Fetch precompiled iOS libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        working-directory: blender
        run: |
          python3 ./build_files/utils/make_update.py --no-blender --use-ios-libraries
          test -d lib/ios_arm64 || { echo "::error::iOS libraries (lib/ios_arm64) missing"; exit 1; }

      - name: Save libraries before compiling
        if: steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            blender/lib/ios_arm64
            blender/lib/macos_arm64
            blender/lib/macos_x64
          key: blender-ios-libs-v2-${{ runner.arch }}-${{ env.BLENDER_COMMIT }}

      - name: Prepare compiler cache
        id: toolchain
        if: env.USE_CCACHE == 'true'
        run: |
          command -v ccache >/dev/null || brew install ccache
          ccache --version
          # Separate caches when Xcode, the SDK, compiler, or architecture changes.
          KEY="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; uname -m; } | shasum -a 256 | cut -d ' ' -f1)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore compiled objects
        if: env.USE_CCACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ env.BLENDER_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ env.BLENDER_COMMIT }}-

      - name: Reset per-build cache statistics
        if: env.USE_CCACHE == 'true'
        run: ccache --zero-stats

      - name: Apply this repo's patch + custom icon/branding
        run: |
          cd blender
          git apply --check ../overlay/patches/blender-ipad.patch
          git apply ../overlay/patches/blender-ipad.patch
          cp ../overlay/ios/icon/blender_icon.icns release/ios/Blender.app/Assets/blender_icon.icns

      - name: Configure (iOS, Xcode generator)
        id: configure
        run: |
          # APPLE_TARGET_DEVICE=ios sets up the whole iOS toolchain (cross-compile, arm64,
          # SDK, deployment target, Python paths). Do NOT also pass CMAKE_SYSTEM_NAME /
          # CMAKE_OSX_* by hand — that breaks the iOS Python library detection.
          cmake -S blender -B build_ios -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_COMPILER_CCACHE="$USE_CCACHE" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      - name: Verify iOS target configuration
        run: |
          echo "=== Checking Xcode project target SDK ==="
          # The generated project should target iphoneos, not macosx
          if grep -r 'SDKROOT.*iphoneos' build_ios/*.xcodeproj/project.pbxproj; then
            echo "✅ SDKROOT is set to iphoneos"
          else
            echo "::error::SDKROOT is not iphoneos; refusing to compile the wrong target"
            grep -o 'SDKROOT = [^;]*' build_ios/*.xcodeproj/project.pbxproj | head -5
            exit 1
          fi
          echo "=== CMAKE_SYSTEM_NAME from CMakeCache ==="
          grep 'CMAKE_SYSTEM_NAME' build_ios/CMakeCache.txt || true
          echo "=== CMAKE_OSX_SYSROOT from CMakeCache ==="
          grep 'CMAKE_OSX_SYSROOT' build_ios/CMakeCache.txt || true

      - name: Verify Xcode is actually using ccache
        if: env.USE_CCACHE == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          projects = list(Path('build_ios').glob('*.xcodeproj/project.pbxproj'))
          if not any(re.search(r'\bCC\s*=\s*[^;\n]*/ccache/', p.read_text()) for p in projects):
              raise SystemExit('Xcode compiler cache launcher is missing; check WITH_COMPILER_CCACHE')
          PY
          echo "=== APPLE_TARGET_DEVICE from CMakeCache ==="
          grep 'APPLE_TARGET_DEVICE' build_ios/CMakeCache.txt || true

      - name: Build (Release, install target)
        id: compile
        run: |
          # Pass -sdk and -destination to xcodebuild (via cmake --build's -- passthrough)
          # to ensure the build targets iOS arm64, not the host macOS platform.
          cmake --build build_ios --config Release --target install -- \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -jobs 3 -quiet

      - name: Compiler cache statistics
        if: always() && env.USE_CCACHE == 'true' && steps.configure.outcome == 'success'
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save compiled objects, including progress from a failed build
        if: ${{ !cancelled() && env.USE_CCACHE == 'true' && steps.compile.outcome != 'skipped' && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ env.BLENDER_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package .ipa
        run: |
          APP="$(python3 overlay/build/select_ios_app.py build_ios)"
          echo "app bundle: $APP"
          test -n "$APP" || { echo "::error::Blender.app not found"; exit 1; }
          # Bundle precompiled iOS dylibs into the app (mirrors the reference recipe).
          LIBDST="$APP/Assets/lib"; mkdir -p "$LIBDST"
          find blender/lib/ios_arm64 -name '*.dylib' \( -type f -o -type l \) -exec cp -fL {} "$LIBDST/" \; || true
          find "$APP" -name 'libpython*.dylib' -exec cp -fn {} "$LIBDST/" \; || true
          # iPad-Unofficial branding + iOS app icon (iOS ignores the .icns, so inject PNGs).
          bash overlay/build/apply_branding.sh "$APP" overlay/ios/icon/icon_1024.png
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type l ! -exec test -e {} \; -delete || true
          zip -qr Blender-iPad-Unofficial.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-Unofficial-ipa
          path: Blender-iPad-Unofficial.ipa
          if-no-files-found: error
          compression-level: 0

      # Only tag pushes (e.g. v0.1.1) publish a Release — named by the tag.
      # Manual runs (workflow_dispatch) stop after the artifact upload above, so they
      # don't clutter Releases with build-N entries.
      - name: Publish Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Create the release if it's new; otherwise just (re)attach the IPA.
          gh release create "$TAG" Blender-iPad-Unofficial.ipa \
            --repo "${{ github.repository }}" \
            --title "Blender iPad (Unofficial) $TAG" \
            --notes "Unsigned IPA built from blender/blender@ios (${BLENDER_COMMIT}) + this repo's patch. Sideload with Sideloadly or AltStore/SideStore (free Apple ID = 7-day expiry). Unofficial build — not affiliated with the Blender Foundation." \
          || gh release upload "$TAG" Blender-iPad-Unofficial.ipa --repo "${{ github.repository }}" --clobber
